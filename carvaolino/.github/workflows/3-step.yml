name: Step 3

on:
  push:
    branches:
      - main
    paths:
      - _config.yml

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_4_FILE: ".github/steps/4-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.6.0

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for theme minima in _config.yml
        id: check-theme-minima
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v1
        with:
          text-file: _config.yml
          keyphrase: "theme: minima"
      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create comment - add step content
        run: gh issue comment "$ISSUE_URL" --body-file "$STEP_4_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable current workflow and enable next one
        run: gh workflow disable "${{github.workflow}}" && gh workflow enable "Step 4"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
