<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Cliente – Carvão Lino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:   #d90000;
      --red2:  #ff2200;
      --ember: #ff6a00;
      --black: #0a0a0a;
      --dark:  #111111;
      --card:  #161616;
      --gray:  #888888;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* fundo com gradiente sutil igual ao hero */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 110%, #4a0000 0%, #1a0000 35%, #0a0a0a 70%);
      z-index: 0;
    }

    /* texto fantasma de fundo */
    body::after {
      content: 'CARVÃO';
      position: fixed;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28vw;
      color: rgba(217,0,0,0.04);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      pointer-events: none;
      letter-spacing: 10px;
      z-index: 0;
    }

    /* ── Card ── */
    .login-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid rgba(217,0,0,0.25);
      border-radius: 16px;
      padding: 50px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 40px rgba(217,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo ── */
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .login-logo img {
      width: 300px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(217,0,0,0.35));
    }

    .login-tagline {
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 36px;
    }

    /* ── Divider ── */
    .divider {
      width: 50px; height: 3px;
      background: linear-gradient(90deg, var(--red), var(--red2));
      border-radius: 2px;
      margin-bottom: 32px;
    }

    /* ── Título do form ── */
    .login-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 24px;
      align-self: flex-start;
    }

    /* ── Form ── */
    form { width: 100%; display: flex; flex-direction: column; gap: 16px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #aaa;
    }

    input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }

    input::placeholder { color: #444; }

    input:focus {
      border-color: var(--red2);
      background: rgba(217,0,0,0.06);
      box-shadow: 0 0 0 3px rgba(217,0,0,0.15);
    }

    .forgot {
      align-self: flex-end;
      font-size: 0.75rem;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.2s;
      margin-top: -8px;
    }
    .forgot:hover { color: var(--red2); }

    .btn-login {
      margin-top: 8px;
      background: linear-gradient(135deg, var(--red), var(--red2));
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(217,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,34,0,0.55);
    }

    .btn-login:active { transform: translateY(0); }

    /* ── Rodapé do card ── */
    .login-footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--gray);
      text-align: center;
    }

    .login-footer a {
      color: var(--red2);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .login-footer a:hover { color: var(--ember); }

    /* ── Voltar ── */
    .back-link {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--red2); }
    .back-link svg { width: 16px; height: 16px; }

    @media (max-width: 480px) {
      .login-card { padding: 40px 28px 36px; margin: 0 16px; }
      .login-logo img { width: 160px; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Voltar ao site
  </a>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="logo.png" alt="Carvão Lino" />
    </div>
    <p class="login-tagline">Área do Cliente</p>
    <div class="divider"></div>

    <!-- Título -->
    <p class="login-title">Acesse sua conta</p>

    <!-- Formulário -->
    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required />
      </div>
      <a href="#" class="forgot" id="btn-forgot">Esqueci minha senha</a>
      <div id="msg-erro" style="display:none;background:rgba(217,0,0,0.12);border:1px solid rgba(217,0,0,0.4);border-radius:6px;padding:10px 14px;font-size:0.82rem;color:#ff6a00;text-align:center;"></div>
      <div id="msg-ok" style="display:none;background:rgba(0,180,0,0.1);border:1px solid rgba(0,180,0,0.3);border-radius:6px;padding:10px 14px;font-size:0.82rem;color:#4caf50;text-align:center;"></div>
      <button type="submit" class="btn-login" id="btn-entrar">Entrar</button>
    </form>

    <p class="login-footer">
      Não tem uma conta? <a href="https://wa.me/5515997599041" target="_blank">Fale conosco</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://vjqautajuqvchhyxhbij.supabase.co',
      'sb_publishable_Q6nFbpECmBw0N4zfIbWNYA_hTUXx5LW'
    );

    const form     = document.getElementById('login-form');
    const btnLogin = document.getElementById('btn-entrar');
    const msgErro  = document.getElementById('msg-erro');
    const msgOk    = document.getElementById('msg-ok');

    function showErro(texto) {
      msgErro.textContent = texto;
      msgErro.style.display = 'block';
      msgOk.style.display = 'none';
    }

    function showOk(texto) {
      msgOk.textContent = texto;
      msgOk.style.display = 'block';
      msgErro.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      btnLogin.textContent = 'Entrando...';
      btnLogin.disabled = true;
      msgErro.style.display = 'none';
      msgOk.style.display = 'none';

      const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

      if (error) {
        const msgs = {
          'Invalid login credentials': 'E-mail ou senha incorretos.',
          'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
          'Too many requests': 'Muitas tentativas. Tente novamente em alguns minutos.'
        };
        showErro(msgs[error.message] || 'Erro ao entrar. Tente novamente.');
        btnLogin.textContent = 'Entrar';
        btnLogin.disabled = false;
        return;
      }

      // Verifica se o usuário está ativo
      const { data: perfil } = await sb.from('profiles').select('ativo').eq('id', data.user.id).single();
      if (perfil && perfil.ativo === false) {
        await sb.auth.signOut();
        showErro('Usuário desativado. Entre em contato com o administrador.');
        btnLogin.textContent = 'Entrar';
        btnLogin.disabled = false;
        return;
      }

      showOk('Login realizado! Redirecionando...');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    });

    document.getElementById('btn-forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showErro('Digite seu e-mail antes de recuperar a senha.'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email);
      if (error) { showErro('Erro ao enviar e-mail. Tente novamente.'); return; }
      showOk('E-mail de recuperação enviado! Verifique sua caixa de entrada.');
    });
  </script>

</body>
</html>
