<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BBShop — Admin</title>
<script>
  (function() {
    const token = localStorage.getItem('bbshop_token');
    if (!token) { window.location.href = 'login.html'; return; }
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp * 1000 < Date.now()) {
        localStorage.removeItem('bbshop_token');
        window.location.href = 'login.html';
      }
    } catch { window.location.href = 'login.html'; }
  })();
</script>
<style>
  :root {
    --primary: #b44fff;
    --primary-dark: #8a2be2;
    --bg: #0d0d0d;
    --bg2: #111;
    --bg3: #1a1a1a;
    --border: #b44fff33;
    --text: #e0e0e0;
    --text-muted: #888;
    --danger: #f44336;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--bg2); border-bottom: 2px solid var(--primary); padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; gap: 10px; }
  .logo { color: var(--primary); font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
  .logo span { color: #fff; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .badge { background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
  .btn-icon { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
  .btn-logout { border-color: #f4433644; color: #f44336; }

  /* TABS (mobile) */
  .tabs { display: none; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; padding: 14px; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* LAYOUT DESKTOP */
  .layout { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 56px); }

  /* FORM PANEL */
  .form-panel { background: var(--bg2); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  .form-panel h2 { font-size: 1rem; color: #fff; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; background: var(--bg3); border: 1px solid #333; color: #fff;
    padding: 11px 12px; border-radius: 8px; font-size: 0.9rem; outline: none;
    transition: border 0.2s; font-family: inherit; -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--bg3); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* UPLOAD */
  .upload-area {
    border: 2px dashed #333; border-radius: 10px; padding: 18px 12px;
    text-align: center; cursor: pointer; background: var(--bg3); position: relative; transition: all 0.2s;
  }
  .upload-area:active { border-color: var(--primary); background: #1a0a2e44; }
  .upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-area .upload-icon { font-size: 1.8rem; margin-bottom: 4px; }
  .upload-area p { color: var(--text-muted); font-size: 0.78rem; }
  .upload-area span { color: var(--primary); font-weight: 600; }

  .images-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .img-thumb { position: relative; aspect-ratio: 1; background: var(--bg3); border-radius: 8px; overflow: hidden; border: 1px solid #333; }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .remove-img {
    position: absolute; top: 3px; right: 3px; background: #000c; color: #fff;
    border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 0.7rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .main-badge { position: absolute; bottom: 3px; left: 3px; background: var(--primary); color: #fff; font-size: 0.5rem; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
  .img-count { font-size: 0.72rem; color: var(--text-muted); margin-top: 5px; }

  .btn-submit { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; }
  .btn-cancel { background: none; border: 1px solid #333; color: var(--text-muted); padding: 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; width: 100%; margin-top: 8px; }

  /* MAIN PANEL */
  .main-panel { padding: 16px; overflow-y: auto; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat-icon { font-size: 1.3rem; }
  .stat-val { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
  .stat-label { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar h2 { font-size: 0.95rem; color: #fff; }
  .search-input { background: var(--bg3); border: 1px solid #333; color: #fff; padding: 9px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; flex: 1; min-width: 120px; }
  .filter-select { background: var(--bg3); border: 1px solid #333; color: var(--text-muted); padding: 9px 10px; border-radius: 6px; font-size: 0.78rem; outline: none; -webkit-appearance: none; }
  .btn-setup { background: var(--bg3); border: 1px solid var(--border); color: var(--primary); padding: 9px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }

  /* CARDS DE PRODUTO (mobile friendly) */
  .products-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; display: flex; gap: 12px; align-items: flex-start;
  }
  .prod-thumb { width: 60px; height: 60px; background: var(--bg3); border-radius: 8px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
  .prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-weight: 700; color: #fff; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .prod-price { color: var(--primary); font-weight: 700; font-size: 0.95rem; }
  .prod-cat { font-size: 0.7rem; color: var(--text-muted); }
  .cond-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
  .cond-novo { background: #0d4d2a; color: #4caf50; }
  .cond-usado { background: #4d3a0d; color: #ff9800; }
  .prod-stock { font-size: 0.7rem; color: var(--text-muted); }
  .prod-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-edit { background: var(--border); color: var(--primary); border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; flex: 1; }
  .btn-delete { background: #ff433422; color: var(--danger); border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; flex: 1; }
  .featured-toggle { cursor: pointer; font-size: 1.2rem; align-self: flex-start; padding: 4px; }

  .empty-list { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 0.9rem; }

  /* MODAL CONFIRM */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: #000b; z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
  .confirm-box h3 { color: #fff; margin-bottom: 10px; font-size: 1.1rem; }
  .confirm-box p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btns button { flex: 1; padding: 13px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  .btn-confirm-del { background: var(--danger); color: #fff; border: none; }
  .btn-confirm-cancel { background: none; border: 1px solid #333; color: var(--text-muted); }

  /* TOAST */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--primary); color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
  .toast.success { background: #2e7d32; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff4; border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    .tabs { display: flex; }
    .layout { grid-template-columns: 1fr; }
    .form-panel { border-right: none; display: none; }
    .form-panel.active { display: block; }
    .main-panel { display: none; }
    .main-panel.active { display: block; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .header-right .admin-name { display: none; }
    .toolbar { gap: 6px; }
    .toolbar h2 { display: none; }
  }

  /* ===== DESKTOP ===== */
  @media (min-width: 769px) {
    .form-panel, .main-panel { display: block !important; }
    .tabs { display: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚡BB<span>SHOP</span></div>
  <div class="header-right">
    <span class="badge" id="totalBadge">0 produtos</span>
    <span class="admin-name" id="adminName" style="font-size:0.78rem;color:var(--text-muted)"></span>
    <button class="btn-icon" onclick="window.open('index.html','_blank')">🛍️</button>
    <button class="btn-icon btn-logout" onclick="logout()">🚪 Sair</button>
  </div>
</header>

<!-- ABAS MOBILE -->
<div class="tabs">
  <button id="tabProducts" class="active" onclick="switchTab('products')">📋 Produtos</button>
  <button id="tabForm" onclick="switchTab('form')">➕ Cadastrar</button>
</div>

<div class="layout">

  <!-- FORM -->
  <div class="form-panel" id="formPanel">
    <h2 id="formTitle">➕ Novo Produto</h2>
    <input type="hidden" id="editId">

    <div class="form-group">
      <label>📷 Imagens do Produto</label>
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
        <div class="upload-icon">📁</div>
        <p><span>Toque para selecionar</span> fotos</p>
        <p style="margin-top:2px;font-size:0.7rem">Múltiplas imagens · JPG, PNG, WEBP</p>
      </div>
      <div class="images-grid" id="imagesGrid"></div>
      <div class="img-count" id="imgCount"></div>
    </div>

    <div class="form-group">
      <label>Nome do Produto *</label>
      <input type="text" id="name" placeholder="Ex: PC Gamer RTX 4060">
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <textarea id="description" placeholder="Detalhes, especificações, estado..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group" style="margin-bottom:0">
        <label>Preço (R$) *</label>
        <input type="number" id="price" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>Estoque</label>
        <input type="number" id="stock" value="1" min="0" inputmode="numeric">
      </div>
    </div>

    <div class="form-row" style="margin-top:14px">
      <div class="form-group" style="margin-bottom:0">
        <label>Categoria *</label>
        <select id="category">
          <option value="">Selecione...</option>
          <option value="PC Gamer">🖥️ PC Gamer</option>
          <option value="Notebook">💻 Notebook</option>
          <option value="iPhone">📱 iPhone</option>
          <option value="Periférico">🖱️ Periférico</option>
          <option value="Usado">♻️ Usado</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>Condição *</label>
        <select id="condition">
          <option value="novo">✅ Novo</option>
          <option value="usado">🔄 Usado</option>
        </select>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="featured" style="width:20px;height:20px;margin:0;flex-shrink:0">
      <label for="featured" style="margin:0;cursor:pointer;font-size:0.88rem;color:var(--text)">⭐ Destaque na loja</label>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitProduct()">➕ Cadastrar Produto</button>
    <button class="btn-cancel" id="cancelBtn" onclick="resetForm()" style="display:none">✕ Cancelar Edição</button>
  </div>

  <!-- MAIN -->
  <div class="main-panel active" id="mainPanel">
    <div class="stats">
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val" id="statTotal">0</div><div class="stat-label">Produtos</div></div>
      <div class="stat-card"><div class="stat-icon">🆕</div><div class="stat-val" id="statNovo">0</div><div class="stat-label">Novos</div></div>
      <div class="stat-card"><div class="stat-icon">♻️</div><div class="stat-val" id="statUsado">0</div><div class="stat-label">Usados</div></div>
      <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-val" id="statFeatured">0</div><div class="stat-label">Destaque</div></div>
    </div>

    <div class="toolbar">
      <h2>📋 Produtos</h2>
      <input class="search-input" type="text" placeholder="🔍 Buscar produto..." id="adminSearch" oninput="filterList()">
      <select class="filter-select" id="filterCat" onchange="filterList()">
        <option value="">Todas</option>
        <option value="PC Gamer">PC Gamer</option>
        <option value="Notebook">Notebook</option>
        <option value="iPhone">iPhone</option>
        <option value="Periférico">Periférico</option>
        <option value="Usado">Usado</option>
      </select>
      <button class="btn-setup" onclick="runSetup()">⚙️ Setup</button>
    </div>

    <div class="products-list" id="productsList">
      <div class="empty-list">Carregando...</div>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>🗑️ Excluir Produto</h3>
    <p>Tem certeza? Esta ação não pode ser desfeita.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '/.netlify/functions/products';
  const IMG_API = '/.netlify/functions/images';

  const adminName = localStorage.getItem('bbshop_admin_name');
  if (adminName) document.getElementById('adminName').textContent = '👤 ' + adminName;

  function logout() {
    localStorage.removeItem('bbshop_token');
    localStorage.removeItem('bbshop_admin_name');
    window.location.href = 'login.html';
  }

  // TABS MOBILE
  function switchTab(tab) {
    const isForm = tab === 'form';
    document.getElementById('formPanel').classList.toggle('active', isForm);
    document.getElementById('mainPanel').classList.toggle('active', !isForm);
    document.getElementById('tabForm').classList.toggle('active', isForm);
    document.getElementById('tabProducts').classList.toggle('active', !isForm);
    window.scrollTo(0, 0);
  }

  let products = [];
  let deleteId = null;
  let newImages = [];
  let existingImages = [];
  let removedImageIds = [];
  const categoryIcons = { 'PC Gamer':'🖥️','Notebook':'💻','iPhone':'📱','Periférico':'🖱️','Usado':'♻️' };

  // UPLOAD
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--primary)'; });
  uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = '#333');
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#333'; handleFiles(e.dataTransfer.files); });

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => { newImages.push(e.target.result); renderImagesGrid(); };
      reader.readAsDataURL(file);
    });
  }

  function renderImagesGrid() {
    const grid = document.getElementById('imagesGrid');
    const total = existingImages.length + newImages.length;
    document.getElementById('imgCount').textContent = total ? `${total} imagem(ns)` : '';
    grid.innerHTML =
      existingImages.map((img, i) => `
        <div class="img-thumb">
          <img src="${img.image_data}">
          ${i === 0 ? '<span class="main-badge">CAPA</span>' : ''}
          <button class="remove-img" onclick="removeExistingImage(${img.id},${i})">✕</button>
        </div>`).join('') +
      newImages.map((b64, i) => `
        <div class="img-thumb">
          <img src="${b64}">
          ${existingImages.length === 0 && i === 0 ? '<span class="main-badge">CAPA</span>' : ''}
          <button class="remove-img" onclick="removeNewImage(${i})">✕</button>
        </div>`).join('');
  }

  function removeExistingImage(id, idx) { removedImageIds.push(id); existingImages.splice(idx, 1); renderImagesGrid(); }
  function removeNewImage(idx) { newImages.splice(idx, 1); renderImagesGrid(); }

  // PRODUTOS
  async function loadProducts() {
    try {
      const res = await fetch(API);
      products = await res.json();
      renderList(products);
      updateStats();
    } catch { showToast('Erro ao carregar produtos', 'error'); }
  }

  function renderList(list) {
    const container = document.getElementById('productsList');
    document.getElementById('totalBadge').textContent = `${list.length} produto${list.length!==1?'s':''}`;
    if (!list.length) {
      container.innerHTML = '<div class="empty-list">📦 Nenhum produto cadastrado ainda.</div>';
      return;
    }
    container.innerHTML = list.map(p => {
      const thumb = p.thumbnail
        ? `<img src="${p.thumbnail}" onerror="this.parentElement.innerHTML='${categoryIcons[p.category]||'📦'}'">`
        : (categoryIcons[p.category]||'📦');
      return `
      <div class="product-row">
        <div class="prod-thumb">${thumb}</div>
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-meta">
            <span class="prod-price">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
            <span class="prod-cat">${p.category||''}</span>
            <span class="cond-badge ${p.condition==='usado'?'cond-usado':'cond-novo'}">${p.condition}</span>
            <span class="prod-stock">Estoque: ${p.stock}</span>
          </div>
          <div class="prod-actions">
            <button class="btn-edit" onclick="editProduct(${p.id})">✏️ Editar</button>
            <button class="btn-delete" onclick="askDelete(${p.id})">🗑️ Excluir</button>
            <span class="featured-toggle" onclick="toggleFeatured(${p.id},${!p.featured})">${p.featured?'⭐':'☆'}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = products.length;
    document.getElementById('statNovo').textContent = products.filter(p=>p.condition==='novo').length;
    document.getElementById('statUsado').textContent = products.filter(p=>p.condition==='usado').length;
    document.getElementById('statFeatured').textContent = products.filter(p=>p.featured).length;
  }

  function filterList() {
    const q = document.getElementById('adminSearch').value.toLowerCase();
    const cat = document.getElementById('filterCat').value;
    renderList(products.filter(p =>
      (!q || p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)) &&
      (!cat || p.category === cat)
    ));
  }

  async function submitProduct() {
    const name = document.getElementById('name').value.trim();
    const price = document.getElementById('price').value;
    const category = document.getElementById('category').value;
    if (!name || !price || !category) { showToast('Preencha nome, preço e categoria', 'error'); return; }

    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<span class="spinner"></span>Salvando...';
    btn.disabled = true;

    const body = {
      name,
      description: document.getElementById('description').value,
      price: parseFloat(price),
      category,
      condition: document.getElementById('condition').value,
      image_url: null,
      stock: parseInt(document.getElementById('stock').value) || 0,
      featured: document.getElementById('featured').checked
    };

    const editId = document.getElementById('editId').value;
    try {
      const method = editId ? 'PUT' : 'POST';
      const url = editId ? `${API}?id=${editId}` : API;
      const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(await res.text());
      const saved = await res.json();

      for (const imgId of removedImageIds) {
        await fetch(`${IMG_API}?id=${imgId}`, { method: 'DELETE' });
      }
      if (newImages.length) {
        await fetch(IMG_API, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ product_id: saved.id, images: newImages })
        });
      }

      showToast(editId ? '✅ Produto atualizado!' : '✅ Produto cadastrado!', 'success');
      resetForm();
      loadProducts();
      switchTab('products');
    } catch(e) {
      showToast('Erro: ' + e.message, 'error');
    } finally {
      btn.innerHTML = editId ? '💾 Salvar Alterações' : '➕ Cadastrar Produto';
      btn.disabled = false;
    }
  }

  async function editProduct(id) {
    const p = products.find(p => p.id == id);
    if (!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('name').value = p.name;
    document.getElementById('description').value = p.description || '';
    document.getElementById('price').value = p.price;
    document.getElementById('category').value = p.category || '';
    document.getElementById('condition').value = p.condition || 'novo';
    document.getElementById('stock').value = p.stock || 0;
    document.getElementById('featured').checked = p.featured || false;
    document.getElementById('formTitle').textContent = '✏️ Editar: ' + p.name;
    document.getElementById('submitBtn').textContent = '💾 Salvar Alterações';
    document.getElementById('cancelBtn').style.display = 'block';

    newImages = [];
    removedImageIds = [];
    try {
      const res = await fetch(`${IMG_API}?product_id=${id}`);
      existingImages = await res.json();
    } catch { existingImages = []; }
    renderImagesGrid();
    switchTab('form');
    window.scrollTo(0, 0);
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    ['name','description','price'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('category').value = '';
    document.getElementById('condition').value = 'novo';
    document.getElementById('stock').value = '1';
    document.getElementById('featured').checked = false;
    document.getElementById('fileInput').value = '';
    document.getElementById('imagesGrid').innerHTML = '';
    document.getElementById('imgCount').textContent = '';
    document.getElementById('formTitle').textContent = '➕ Novo Produto';
    document.getElementById('submitBtn').textContent = '➕ Cadastrar Produto';
    document.getElementById('cancelBtn').style.display = 'none';
    newImages = []; existingImages = []; removedImageIds = [];
  }

  function askDelete(id) { deleteId = id; document.getElementById('confirmOverlay').classList.add('open'); }
  function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); deleteId = null; }

  async function confirmDelete() {
    if (!deleteId) return;
    try {
      await fetch(`${API}?id=${deleteId}`, { method: 'DELETE' });
      showToast('🗑️ Produto removido', 'success');
      closeConfirm();
      loadProducts();
    } catch { showToast('Erro ao remover', 'error'); }
  }

  async function toggleFeatured(id, featured) {
    const p = products.find(p => p.id == id);
    if (!p) return;
    try {
      await fetch(`${API}?id=${id}`, {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ ...p, featured })
      });
      loadProducts();
    } catch {}
  }

  async function runSetup() {
    try {
      const res = await fetch('/.netlify/functions/setup');
      const data = await res.json();
      showToast(data.message || data.error, res.ok ? 'success' : 'error');
      if (res.ok) loadProducts();
    } catch { showToast('Erro ao configurar', 'error'); }
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadProducts();
</script>
</body>
</html>
