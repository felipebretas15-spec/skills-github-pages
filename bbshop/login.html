<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBShop — Login Admin</title>
<style>
  :root {
    --primary: #b44fff;
    --primary-dark: #8a2be2;
    --bg: #0d0d0d;
    --bg2: #111;
    --bg3: #1a1a1a;
    --border: #b44fff33;
    --text: #e0e0e0;
    --text-muted: #888;
    --danger: #f44336;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(ellipse at 20% 50%, #1a0a2e44 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 50%, #0a1a2e44 0%, transparent 60%);
  }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px #b44fff1a;
  }

  .logo {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo-text {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--primary);
    text-shadow: 0 0 30px var(--primary);
  }
  .logo-text span { color: #fff; }
  .logo-sub {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 36px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--border); }

  .password-wrapper { position: relative; }
  .toggle-pass {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;
  }

  .btn-login {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px var(--primary)44;
    letter-spacing: 1px;
  }
  .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-msg {
    background: #ff433415;
    border: 1px solid #ff433444;
    color: #ff6b6b;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }

  .back-link {
    text-align: center;
    margin-top: 24px;
  }
  .back-link a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.2s;
  }
  .back-link a:hover { color: var(--primary); }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid #fff4; border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-text">⚡BB<span>SHOP</span></div>
  </div>
  <div class="logo-sub">Painel Administrativo</div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="admin@bbshop.com" autocomplete="email">
  </div>

  <div class="form-group">
    <label>Senha</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <button class="toggle-pass" onclick="togglePassword()" type="button">👁</button>
    </div>
  </div>

  <button class="btn-login" id="loginBtn" onclick="login()">Entrar no Admin</button>

  <div class="back-link">
    <a href="index.html">← Voltar para a loja</a>
  </div>
</div>

<script>
  // Redireciona se já está logado
  if (localStorage.getItem('bbshop_token')) {
    window.location.href = 'admin.html';
  }

  function togglePassword() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');

    errorMsg.classList.remove('show');
    if (!email || !password) {
      errorMsg.textContent = 'Preencha e-mail e senha.';
      errorMsg.classList.add('show');
      return;
    }

    btn.innerHTML = '<span class="spinner"></span>Entrando...';
    btn.disabled = true;

    try {
      const res = await fetch('/.netlify/functions/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error || 'Erro ao fazer login.';
        errorMsg.classList.add('show');
        return;
      }

      localStorage.setItem('bbshop_token', data.token);
      localStorage.setItem('bbshop_admin_name', data.name);
      window.location.href = 'admin.html';
    } catch {
      errorMsg.textContent = 'Erro de conexão. Tente novamente.';
      errorMsg.classList.add('show');
    } finally {
      btn.innerHTML = 'Entrar no Admin';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
